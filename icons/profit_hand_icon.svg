    <circle cx="80" cy="34" r="5" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
    <circle cx="62" cy="27" r="4.5" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
